<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nourish</title>
<meta name="description" content="Your daily meal plan — portions measured, math done.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nourish">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151816" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#F6F4EF; --card:#FFFFFF; --ink:#1E2320; --muted:#6E746F; --faint:#A3A8A3; --line:#E9E5DC;
  --accent:#4C7A58; --accent-ink:#FFFFFF; --soft:#E8F0E9; --warn:#B4652F; --warn-soft:#FBEEE4;
  --pro:#C46A4A; --carb:#D3A23E; --fat:#5E86AE;
  --shadow:0 1px 2px rgba(30,35,32,.04),0 4px 16px rgba(30,35,32,.05);
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151816; --card:#1E2220; --ink:#ECEEEA; --muted:#A1A7A2; --faint:#6F756F; --line:#2C312E;
    --accent:#7DB08A; --accent-ink:#0F1511; --soft:#233027; --warn:#E39A68; --warn-soft:#3A2A1F;
    --pro:#E08B6C; --carb:#E2B85E; --fat:#87A9CC;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:540px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:28px;line-height:1.15;margin:2px 0 4px;font-weight:700;letter-spacing:-.02em}
h2{font-size:20px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
h3{font-size:15px;margin:0;font-weight:600}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:14px 0}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:14px;font-weight:600;font-size:15px;background:var(--soft);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--muted)}
.btn:active{transform:scale(.98)}
/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
/* progress */
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.macros .lbl{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:6px}
.macros b{font-size:15px;color:var(--ink);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
/* water */
.water{display:flex;gap:8px;margin-top:10px}
.water button{flex:1;height:34px;border-radius:10px;background:var(--line);transition:background .2s}
.water button.on{background:var(--fat)}
/* hero */
.hero{background:var(--soft);box-shadow:none}
.hero .when{font-size:13px;font-weight:600;color:var(--accent)}
.hero h2{font-size:24px;margin:4px 0 2px}
/* timeline */
.tl{padding:6px 0}
.item{border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.ihead{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:10px;padding:14px 18px;width:100%;text-align:left}
.ihead .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ihead .nm{display:block;font-weight:600;font-size:15px;line-height:1.3}
.ihead .sb{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.item.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.item.now{background:linear-gradient(90deg,var(--soft),transparent 70%)}
.item.info .nm{font-weight:500}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:all .2s}
.check svg{opacity:0;width:16px;height:16px}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on svg{opacity:1}
.body{padding:0 18px 18px}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ing li:last-child{border-bottom:0}
.ing .amt{text-align:right;font-weight:600;white-space:nowrap}
.ing .amt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.how{margin:12px 0 0;font-size:14px;color:var(--ink)}
.why{margin:10px 0 0;font-size:13px;color:var(--accent);display:flex;gap:8px}
.mline{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.mline b{color:var(--ink);font-weight:600}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .btn{flex:1}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;width:100%;max-width:540px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--faint)}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:24px;height:24px}
/* segmented + days */
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin:14px 0}
.seg button{flex:1;height:34px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:4px 0 0}
.days button{height:54px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted);font-weight:600}
.days button b{font-size:16px;color:var(--ink)}
.days button.on{background:var(--accent);color:var(--accent-ink)}
.days button.on b{color:var(--accent-ink)}
.days button.today:not(.on){outline:2px solid var(--accent);outline-offset:-2px}
/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list .check{width:26px;height:26px}
.list li.got .grow{opacity:.45;text-decoration:line-through}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--line);color:var(--muted);font-weight:500}
.pill.on{background:var(--soft);color:var(--accent)}
/* forms */
details.card{padding:0}
details.card>summary{list-style:none;padding:18px;display:flex;justify-content:space-between;align-items:center;font-weight:600;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary:after{content:"";width:9px;height:9px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);margin-top:-4px;transition:transform .2s}
details.card[open]>summary:after{transform:rotate(-135deg);margin-top:4px}
details.card>.in{padding:0 18px 18px}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-size:15px}
.field label small{display:block;color:var(--muted);font-size:12px}
.field input,.field select{width:118px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;text-align:right;font-size:16px}
.field input[type=text]{width:160px}
.field select{text-align:left;width:190px}
.switch{width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--accent)}
.switch.on:after{transform:translateX(20px)}
.carbs{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:14px;padding:12px 14px;margin-top:12px}
.rules p{margin:8px 0;font-size:14px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;background:var(--card)}
.opt.on{border-color:var(--accent);background:var(--soft)}
.opt .nums{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:14px}
/* sheet + onboarding */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
.scrim.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:24px 24px 0 0;max-height:80vh;overflow:auto;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:540px;margin:0 auto}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.ob{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto}
.ob .wrap{padding-bottom:40px;min-height:100%;display:flex;flex-direction:column}
.ob .grow{flex:1}
.logo{width:56px;height:56px;border-radius:16px;background:var(--accent);display:grid;place-items:center;margin:24px 0 18px}
.steps{display:flex;gap:6px;margin:10px 0 0}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
svg.chart{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;z-index:70;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="view" class="wrap"></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="scrim" id="scrim" data-a="close"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div id="ob"></div>

function mac(fid,q){
  const f=F[fid];
  // oz foods are stored in fl oz; everything else in grams (or units)
  const m=f.u?q:f.herb?0:(f.oz?q*29.57/100:q/100);
  return {cal:f.cal*m,p:f.p*m,c:f.c*m,f:f.f*m};
}
function sumMac(items){const t={cal:0,p:0,c:0,f:0};for(const it of items){const m=mac(it.fid,it.q);t.cal+=m.cal;t.p+=m.p;t.c+=m.c;t.f+=m.f;}return t;}

/* amount the way you'd measure it */
function amt(fid,q){
  const f=F[fid];
  if(f.herb) return {main:f.herb};
  if(f.u){ if(fid==='egg') return {main:`${q} ${q===1?f.u:f.us}`};
    if(fid==='lemon'||fid==='lime') return {main:`${fr(q)} ${q>1?f.us:f.u}`, sub:fid==='lemon'?'juice':''};
    return {main:`${fr(q)} ${q>1?f.us:f.u}`}; }
  if(f.tsp){ const t=q/f.tsp; const tb=t>=3&&Math.abs(t/1.5-Math.round(t/1.5))<.01;
    return {main:tb?`${fr(t/3)} Tbsp`:`${fr(t)} tsp`, sub:`${r1(q)} g`}; }
  if(f.ck) return {main:`${q} g`, sub:`${r1(q/28.35)} oz cooked`};
  if(f.ml) return {main:`${fr(q/240)} cup${q>240?'s':''}`, sub:`${q} ml`};
  if(f.oz) return {main:`${Math.round(q)} oz`, sub:`${fr(q/8)} cup`};
  if(f.cz) return {main:`${q} g`, sub:`${fr(q/28.35)} oz`};
  if(f.tb) return {main:`${q} g`, sub:`${fr(q/f.tb)} Tbsp`};
  if(f.pc){ const n=q/f.pc[0]; return {main:`${q} g`, sub:`about ${fr(n)==='0'?'a bit of':fr(n)} ${n>1.1?f.pc[2]:f.pc[1]}`}; }
  if(f.cup) return {main:`${q} g`, sub:`about ${fr(q/f.cup)==='0'?'a little':fr(q/f.cup)+' cup'}`};
  return {main:`${q} g`};
}
function stepOf(fid){const f=F[fid];return f.u?(fid==='egg'?1:.25):f.tsp?f.tsp/2:5;}

/* ============================================================
   PLANNER ENGINE
   Builds a day, then resizes portions so the whole day lands on
   her protein / carb / fat targets while each meal keeps its shape
   (low-carb breakfast, 30 g+ protein, more carbs at lunch, etc).
   Solver: bounded coordinate descent on a weighted least-squares
   objective, then rounding to kitchen-friendly steps and a polish.
   ============================================================ */
function schedule(){
  const bf=S.wake+45, din=S.dinner, s2=din-180, span=s2-bf;
  const t={wake:S.wake,b:bf,coffee:bf+5,s2,d:din,close:din+30};
  if(S.early){t.s1=r15(bf+span*.33);t.l=r15(bf+span*.57);} else t.l=r15(bf+span*.5);
  t.adrenal=r15((t.l+s2)/2);
  return t;
}
function recipeFor(slot,key,dow){ return (S.swaps[key]&&S.swaps[key][slot])||WEEK[slot][dow]; }
function mkItems(list){return list.map(([fid,q,role,min,max])=>({fid,q,role:role||'x',min:min??q,max:max??q,base:q}));}
function shakeItems(fruitKey){
  const st=S.st;
  return mkItems([['water',st.waterOz,'x'],['milk',st.milkOz,'x'],['protein',st.scoops,'x'],[FRUITS[fruitKey][0],150,'c',0,300]]);
}

const _cache={};
function buildDay(key){
  applyStaples();
  const sig=key+JSON.stringify([S.macros,S.st,S.early,S.wake,S.dinner,S.swaps[key]||0]);
  if(_cache[key]&&_cache[key].sig===sig) return _cache[key].day;
  const dow=pKey(key).getDay(), T=schedule();
  const tgt={...S.macros,c:carbsOf(S.macros)};
  const coffee=mkItems([['coffee',1],['creamer',S.st.cTbsp]]);
  const adrenal=mkItems([['lime',S.st.limes],['coconutWater',S.st.cwOz],['salt',1]]);
  const meals=[];
  const add=(slot)=>{const rk=recipeFor(slot,key,dow);
    const items=slot==='s2'?shakeItems(rk):mkItems(R[rk].items);
    meals.push({slot,rk,items});};
  add('b'); if(S.early) add('s1'); add('l'); add('s2'); add('d');

  // what's left after the fixed drinks
  const fx=sumMac([...coffee,...adrenal]);
  const Rm={p:tgt.p-fx.p,c:tgt.c-fx.c,f:tgt.f-fx.f};
  const fixedOf=m=>sumMac(m.items.filter(i=>i.role==='x'));
  const MT={};
  MT.b={p:clamp(Rm.p*.2,33,40),c:6,f:Math.max(13,Rm.f*.25)};
  const s1=meals.find(m=>m.slot==='s1'); if(s1) MT.s1=sumMac(s1.items);
  const sh=fixedOf(meals.find(m=>m.slot==='s2'));
  MT.s2={p:sh.p+1,c:sh.c+Rm.c*.12,f:sh.f};
  const rest={};for(const k of ['p','c','f']) rest[k]=Rm[k]-MT.b[k]-(MT.s1?MT.s1[k]:0)-MT.s2[k];
  MT.l={p:rest.p*.5,c:rest.c*.52,f:rest.f*.5}; MT.d={p:rest.p*.5,c:rest.c*.48,f:rest.f*.5};
  solve(meals,Rm,MT);

  const rows=[];
  rows.push({id:'wake',type:'info',t:T.wake,title:'Wake up',sub:'Start with a big glass of water.'});
  const pushMeal=m=>{const r=m.slot==='s2'?{n:`Protein Shake + ${FRUITS[m.rk][1]}`,how:`Shake ${S.st.waterOz} oz water, ${S.st.milkOz} oz A2 whole milk and ${fr(S.st.scoops)} scoops Prime Protein. Eat the fruit on the side.`,why:'Your protein-rich snack — it protects muscle while you lose fat.'}:R[m.rk];
    rows.push({id:m.slot,type:'meal',slot:m.slot,rk:m.rk,t:T[m.slot],label:SLOTNAME[m.slot],title:r.n,how:r.how,why:r.why,items:m.items,m:sumMac(m.items)});};
  pushMeal(meals[0]);
  rows.push({id:'coffee',type:'drink',t:T.coffee,label:'Coffee',title:'Your coffee',how:'With breakfast or right after. Same every day.',why:'Coffee is linked to a healthier liver.',items:coffee,m:sumMac(coffee)});
  for(const m of meals.slice(1)){
    if(m.slot==='s2') rows.push({id:'adrenal',type:'drink',t:T.adrenal,label:'Drink',title:'Adrenal cocktail',how:'Squeeze a whole lime into coconut water, add a pinch of sea salt, stir.',why:'Potassium, sodium & vitamin C for steady afternoon energy.',items:adrenal,m:sumMac(adrenal)});
    pushMeal(m);
  }
  rows.push({id:'close',type:'info',t:T.close,title:'Kitchen closed',sub:'Water or herbal tea only from here. A 10-minute walk helps.'});
  const totals=sumMac(rows.filter(r=>r.items).flatMap(r=>r.items));
  const day={key,rows,totals,tgt};
  _cache[key]={sig,day};
  return day;
}

function solve(meals,T,MT){
  const W={p:1/9,c:1/36,f:1/9}, L=.25, K=['p','c','f'];
  const vars=[];
  meals.forEach((m,mi)=>m.items.forEach(it=>{ if(it.role!=='x'){
    const a=mac(it.fid,1); vars.push({mi,it,a,rho:.25/(it.base*it.base),step:stepOf(it.fid)}); }}));
  const D={p:0,c:0,f:0}, M=meals.map(()=>({p:0,c:0,f:0}));
  const recompute=()=>{for(const k of K)D[k]=0;M.forEach(x=>{for(const k of K)x[k]=0;});
    meals.forEach((m,mi)=>{const s=sumMac(m.items);for(const k of K){D[k]+=s[k];M[mi][k]+=s[k];}});};
  const J=()=>{let j=0;for(const k of K)j+=W[k]*(D[k]-T[k])**2;
    meals.forEach((m,mi)=>{const t=MT[m.slot];for(const k of K)j+=L*W[k]*(M[mi][k]-t[k])**2;});
    for(const v of vars)j+=v.rho*(v.it.q-v.it.base)**2;return j;};
  recompute();
  for(let sweep=0;sweep<120;sweep++){
    for(const v of vars){
      const x=v.it.q, t=MT[meals[v.mi].slot]; let num=v.rho*v.it.base, den=v.rho;
      for(const k of K){const a=v.a[k]; if(!a) continue;
        num+=W[k]*a*(a*x-(D[k]-T[k]))+L*W[k]*a*(a*x-(M[v.mi][k]-t[k]));
        den+=W[k]*a*a*(1+L);}
      const xn=clamp(num/den,v.it.min,v.it.max), d=xn-x;
      if(d){for(const k of K){D[k]+=v.a[k]*d;M[v.mi][k]+=v.a[k]*d;} v.it.q=xn;}
    }
  }
  // round to kitchen steps (5 g, whole eggs, half teaspoons)
  for(const v of vars){const s=v.step;v.it.q=clamp(Math.round(v.it.q/s)*s,Math.ceil(v.it.min/s-1e-9)*s,v.it.max);v.it.q=+v.it.q.toFixed(2);}
  recompute();
  // polish: nudge one step at a time while it helps
  for(let pass=0;pass<30;pass++){let better=false;
    for(const v of vars) for(const dir of [-1,1]){
      const old=v.it.q, nq=+(old+dir*v.step).toFixed(2);
      if(nq<v.it.min-1e-9||nq>v.it.max+1e-9) continue;
      const j0=J(); v.it.q=nq; recompute();
      if(J()<j0-1e-9) better=true; else {v.it.q=old; recompute();}
    }
    if(!better) break;}
}

function mline(m){return `<div class="mline"><span><b>${fmtN(m.cal)}</b> cal</span><span><i class="dot" style="background:var(--pro)"></i>Protein <b>${Math.round(m.p)}g</b></span><span><i class="dot" style="background:var(--carb)"></i>Carbs <b>${Math.round(m.c)}g</b></span><span><i class="dot" style="background:var(--fat)"></i>Fat <b>${Math.round(m.f)}g</b></span></div>`;}
function ingList(items){return `<ul class="ing">${items.filter(i=>i.fid!=='water'||i.q>0).map(i=>{const a=amt(i.fid,i.q);return `<li><span>${esc(F[i.fid].n)}</span><span class="amt">${a.main}${a.sub?`<small>${a.sub}</small>`:''}</span></li>`;}).join('')}</ul>`;}
function detail(r,key,checkable){
  const done=!!logOf(key).done[r.id];
  return `${ingList(r.items)}
  ${r.how?`<p class="how">${esc(r.how)}</p>`:''}
  ${r.why?`<p class="why">${ICON.leaf}<span>${esc(r.why)}</span></p>`:''}
  ${mline(r.m)}
  <div class="actions">
    ${r.type==='meal'?`<button class="btn" data-a="swap" data-k="${key}" data-s="${r.slot}">Swap meal</button>`:''}
    ${checkable?`<button class="btn ${done?'':'primary'}" data-a="check" data-k="${key}" data-id="${r.id}">${done?'Undo':'I ate this'}</button>`:''}
  </div>`;
}
function timeline(day,checkable,now){
  const lg=logOf(day.key);
  return `<div class="card tl">${day.rows.map(r=>{
    const isOpen=UI.open===day.key+r.id, done=!!lg.done[r.id];
    const sub=r.items?`${fmtN(r.m.cal)} cal · ${Math.round(r.m.p)}g protein`:r.sub;
    const cls=['item',r.type==='info'?'info':'',done?'done':'',now===r.id?'now':''].join(' ');
    const right=r.items&&checkable?`<span class="check ${done?'on':''}" data-a="check" data-k="${day.key}" data-id="${r.id}" role="checkbox" aria-checked="${done}">${ICON.check}</span>`:(r.items?`<span class="tiny muted">${isOpen?'Hide':'View'}</span>`:'');
    return `<div class="${cls}">
      <button class="ihead" ${r.items?`data-a="open" data-v="${day.key+r.id}"`:''}>
        <span class="t">${tfmt(r.t)}</span>
        <span><span class="nm">${r.label&&r.type==='meal'?`<span class="tiny muted" style="display:block;font-weight:500">${r.label}</span>`:''}${esc(r.title)}</span><span class="sb">${esc(sub)}</span></span>
        ${right}
      </button>
      ${isOpen&&r.items?`<div class="body">${detail(r,day.key,checkable)}</div>`:''}
    </div>`;}).join('')}</div>`;
}

function viewToday(){
  const key=dKey(today()), day=buildDay(key), lg=logOf(key), nm=nowMin();
  const eaten={cal:0,p:0,c:0,f:0};
  for(const r of day.rows) if(r.items&&lg.done[r.id]) for(const k in eaten) eaten[k]+=r.m[k];
  const tg={cal:S.macros.cal,p:S.macros.p,c:carbsOf(S.macros),f:S.macros.f};
  const check=day.rows.filter(r=>r.items);
  const next=check.find(r=>!lg.done[r.id]&&r.t+60>=nm)||null;
  const nowRow=[...day.rows].reverse().find(r=>r.t<=nm)?.id;
  const h=new Date().getHours(), greet=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const allDone=check.every(r=>lg.done[r.id]);
  const bottles=Math.max(4,Math.round(Math.min(100,curWeight()/2)/16));
  const streak=calcStreak();
  const gd=goalDate();
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  let hero;
  if(next){
    hero=`<div class="card hero">
      <div class="when">${next.t<=nm?'Now':'Up next'} · ${tfmt(next.t)}${next.label?` · ${next.label}`:''}</div>
      <h2>${esc(next.title)}</h2>
      <div style="margin-top:8px">${detail(next,key,true)}</div></div>`;
  } else if(allDone){
    hero=`<div class="card hero"><div class="when">All done</div><h2>You nailed today.</h2><p class="muted small" style="margin:6px 0 0">Kitchen’s closed — water or herbal tea only. See you tomorrow.</p></div>`;
  } else {
    hero=`<div class="card hero"><div class="when">Kitchen closed · ${tfmt(day.rows.find(r=>r.id==='close').t)}</div><h2>Rest up.</h2><p class="muted small" style="margin:6px 0 0">Anything not checked off? Tap it below so your numbers stay right.</p></div>`;
  }
  const bar=(k,label,color)=>`<div><div class="lbl"><span><i class="dot" style="background:${color}"></i>${label}</span></div><div class="bar"><i style="width:${Math.min(100,eaten[k]/tg[k]*100)}%;background:${color}"></i></div><div class="tiny muted" style="margin-top:6px"><b>${Math.round(eaten[k])}</b> / ${tg[k]}g</div></div>`;
  return `
  <div class="top"><div><div class="eyebrow">${DOW[today().getDay()]}, ${fmtDate(today())}</div><h1>${greet}${S.name?`, ${esc(S.name)}`:''}</h1></div>
    ${streak>0?`<span class="chip" style="margin-top:6px">${streak}-day streak</span>`:''}</div>
  ${gd?`<p class="muted small" style="margin:2px 0 0">On track to reach <b style="color:var(--ink)">${S.profile.goal} lb</b> around <b style="color:var(--ink)">${fmtDate(gd)}${gd.getFullYear()!==today().getFullYear()?', '+gd.getFullYear():''}</b>.</p>`:''}
  ${!standalone&&!S.hideInstall?`<div class="card row between" style="padding:14px 16px"><div class="small"><b>Make it an app:</b> tap <b>Share</b> <span class="muted">→</span> <b>Add to Home Screen</b>.</div><button class="btn ghost" style="height:32px;padding:0 6px" data-a="hideInstall">✕</button></div>`:''}
  ${hero}
  <div class="card">
    <div class="row between"><div><div class="eyebrow">Eaten today</div><div class="big">${fmtN(eaten.cal)} <span class="muted" style="font-size:16px;font-weight:500">/ ${fmtN(tg.cal)} cal</span></div></div></div>
    <div class="bar" style="margin-top:12px"><i style="width:${Math.min(100,eaten.cal/tg.cal*100)}%"></i></div>
    <div class="macros">${bar('p','Protein','var(--pro)')}${bar('c','Carbs','var(--carb)')}${bar('f','Fat','var(--fat)')}</div>
  </div>
  <div class="card">
    <div class="row between"><h3>Water</h3><span class="small muted">${lg.water} of ${bottles} bottles (16 oz)</span></div>
    <div class="water">${Array.from({length:bottles},(_,i)=>`<button aria-label="bottle ${i+1}" class="${i<lg.water?'on':''}" data-a="water" data-v="${i+1}"></button>`).join('')}</div>
  </div>
  <h2 style="margin:22px 0 0">Today’s plan</h2>
  <p class="small muted" style="margin:2px 0 0">Tap a meal to see exactly what to measure.</p>
  ${timeline(day,true,nowRow)}
  <p class="tiny muted" style="text-align:center">Planned total: ${fmtN(day.totals.cal)} cal · ${Math.round(day.totals.p)}g protein · ${Math.round(day.totals.c)}g carbs · ${Math.round(day.totals.f)}g fat</p>`;
}

function weekStart(off){const t=today();return addDays(t,-t.getDay()+7*off);}
function viewWeek(){
  const seg=`<div class="seg">${[['meals','Meals'],['shop','Shopping'],['prep','Prep']].map(([k,l])=>`<button data-a="seg" data-v="${k}" class="${UI.seg===k?'on':''}">${l}</button>`).join('')}</div>`;
  let body='';
  if(UI.seg==='meals'){
    const ws=weekStart(0); const sel=UI.weekDay??today().getDay();
    const key=dKey(addDays(ws,sel)), day=buildDay(key);
    const used=new Set(); for(let i=0;i<7;i++) for(const r of buildDay(dKey(addDays(ws,i))).rows) if(r.items) for(const it of r.items) used.add(it.fid);
    const hit=GROUPS.filter(g=>g[1].some(f=>used.has(f))).length;
    body=`<div class="days">${DOW.map((d,i)=>{const dt=addDays(ws,i);return `<button data-a="day" data-v="${i}" class="${i===sel?'on':''} ${i===today().getDay()?'today':''}">${d[0]}<b>${dt.getDate()}</b></button>`;}).join('')}</div>
    <p class="small muted" style="margin:14px 0 0">${DOW[sel]} · ${fmtN(day.totals.cal)} cal · ${Math.round(day.totals.p)}g protein · ${Math.round(day.totals.c)}g carbs · ${Math.round(day.totals.f)}g fat</p>
    ${timeline(day,false,null)}
    <div class="card"><div class="row between"><h3>Every food group, every week</h3><span class="chip ${hit<GROUPS.length?'warn':''}">${hit} of ${GROUPS.length}</span></div>
      <p class="small muted" style="margin:6px 0 0">Everything on your “yes” list shows up this week.${hit<GROUPS.length?' Swapping meals took a few out — that’s okay.':''}</p>
      <div class="pills">${GROUPS.map(g=>`<span class="pill ${g[1].some(f=>used.has(f))?'on':''}">${g[0]}</span>`).join('')}</div></div>`;
  } else if(UI.seg==='shop'){
    const ws=weekStart(UI.shopWeek), wk=dKey(ws), got=S.shop[wk]||{};
    const tot={};
    for(let i=0;i<7;i++) for(const r of buildDay(dKey(addDays(ws,i))).rows) if(r.items) for(const it of r.items) tot[it.fid]=(tot[it.fid]||0)+it.q;
    const AIS=[['m','Meat & fish'],['v','Produce'],['d','Dairy & eggs'],['p','Pantry & other']];
    body=`<div class="seg" style="margin-top:0">${[[0,'This week'],[1,'Next week']].map(([k,l])=>`<button data-a="shopWeek" data-v="${k}" class="${UI.shopWeek===k?'on':''}">${l}</button>`).join('')}</div>
    <p class="small muted" style="margin:0">${fmtDate(ws)} – ${fmtDate(addDays(ws,6))}. Amounts already match your portions.</p>
    ${AIS.map(([a,l])=>{const ids=Object.keys(tot).filter(f=>F[f].a===a).sort((x,y)=>F[x].n.localeCompare(F[y].n));
      if(!ids.length) return '';
      return `<div class="card"><h3>${l}</h3><ul class="list">${ids.map(f=>`<li class="${got[f]?'got':''}"><div class="grow"><div>${esc(F[f].n.replace(/, (cooked|baked)$/,''))}</div><div class="small muted">${buyText(f,tot[f])}</div></div><span class="check ${got[f]?'on':''}" data-a="shop" data-w="${wk}" data-v="${f}">${ICON.check}</span></li>`).join('')}</ul></div>`;}).join('')}
    <p class="tiny muted" style="text-align:center">Plus your usual spices: cumin, chili powder, black pepper, garlic powder, paprika.</p>`;
  } else {
    body=`<div class="card"><h3>Sunday · about 1 hour</h3><ul class="list">
      ${['Bake 5–6 sweet potatoes (400°F, 45–60 min).','Cook chicken breasts for Sun–Thu lunches and Tuesday chili.','Brown the ground beef and turkey for breakfasts and the burrito bowls.','Cook a pot of lentils and a pot of black beans (or rinse canned).','Hard-boil 4 eggs for morning snacks.','Make the Beef & Lentil Soup — it covers 2 lunches.'].map(t=>`<li><div class="grow small">${t}</div></li>`).join('')}</ul></div>
    <div class="card"><h3>Wednesday · 20 minutes</h3><ul class="list">
      ${['Bake 3 more sweet potatoes.','Cook more chicken if you’re running low.','Cut up fruit for the rest of the week.'].map(t=>`<li><div class="grow small">${t}</div></li>`).join('')}</ul></div>
    <div class="card"><h3>Good to know</h3><ul class="list">
      ${['Use a kitchen scale set to grams — it’s the easiest way to be exact.','Meat and fish amounts are <b>cooked</b> weight. Weigh after cooking.','Cook only in butter, olive oil, tallow or coconut oil.','Veggies are always cooked — never raw. No spinach or kale.','Log each item in your macro app using the exact grams shown.','Dinner leftovers make a great next-day lunch. Use “Swap meal” to match.'].map(t=>`<li><div class="grow small">${t}</div></li>`).join('')}</ul></div>`;
  }
  return `<div class="eyebrow">Your week</div><h1>Sun – Sat plan</h1>${seg}${body}`;
}
function buyText(f,q){
  const x=F[f], up=(v,s)=>Math.ceil(v/s-1e-9)*s;
  if(x.ck) return `about ${fr(up(q/x.ck/453.6,.25))} lb raw (${Math.round(q)} g cooked)`;
  if(f==='egg') return `${q} eggs${q>=10?` · about ${fr(up(q/12,.5))} dozen`:''}`;
  if(x.herb) return f==='garlic'?'1 head':(x.a==='v'?'1 bunch':'pantry');
  if(x.u) return f==='creamer'?`${q} Tbsp · about ${fr(up(q/32,.5))} pint`:f==='coffee'?'your usual':f==='protein'?`${fr(q)} scoops`:`${Math.ceil(q)} ${x.us}`;
  if(x.tsp) return `about ${fr(up(q/x.tsp/3,.5))} Tbsp this week`;
  if(x.ml) return `about ${Math.ceil(q/240)} cups · ${fr(up(q/946,.5))} quart${q>946?'s':''}`;
  if(x.oz) return `${Math.round(q)} oz${f==='milk'?` · about ${fr(up(q/64,.5))} half-gallon`:''}`;
  if(x.cz) return `${fr(up(q/28.35,.5))} oz`;
  if(x.tb) return `about ${Math.ceil(q/x.tb)} Tbsp (unsweetened)`;
  if(x.bean) return `${Math.round(q)} g cooked · about ${Math.ceil(q/250)} cans, or ${fr(up(q/516,.25))} cup dry`;
  if(x.lentil) return `${Math.round(q)} g cooked · about ${fr(up(q/495,.25))} cup dry`;
  if(f==='pineapple') return `${Math.round(q)} g · about ${fr(up(q/900,.5))} pineapple`;
  if(f==='watermelon') return `${Math.round(q)} g · about ${Math.ceil(q/152)} cups cubed`;
  if(x.pc) return `${Math.ceil(q/x.pc[0])} ${Math.ceil(q/x.pc[0])>1?x.pc[2]:x.pc[1]}`;
  if(x.cup&&x.a==='d') return `about ${fr(up(q/x.cup,.25))} cups`;
  if(x.cup) return `about ${fr(up(q*1.1/453.6,.25))} lb`;
  return `${Math.round(q)} g`;
}

function calcStreak(){
  let n=0, d=today();
  const full=k=>{const day=buildDay(k),lg=S.log[k];return lg&&day.rows.filter(r=>r.type==='meal').every(r=>lg.done[r.id]);};
  if(!full(dKey(d))) d=addDays(d,-1);
  while(S.log[dKey(d)]&&full(dKey(d))&&n<999){n++;d=addDays(d,-1);}
  return n;
}

function viewProgress(){
  const ws=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);
  const start=ws.length?ws[0]:{d:dKey(today()),w:S.profile.start};
  const cur=curWeight(), lost=start.w-cur, t0=pKey(start.d);
  const weeks=16, pred=forecast(start.w,weeks*7);
  const gd=goalDate();
  // chart
  const W=340,H=190,pl=34,pr=20,pt=12,pb=26;
  const lo=Math.min(S.profile.goal,...pred,...ws.map(x=>x.w))-3, hi=Math.max(start.w,...ws.map(x=>x.w))+3;
  const X=d=>pl+(d/(weeks*7))*(W-pl-pr), Y=w=>pt+(hi-w)/(hi-lo)*(H-pt-pb);
  const predPath=pred.map((w,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(w).toFixed(1)}`).join('');
  const pts=ws.map(x=>({d:Math.round((pKey(x.d)-t0)/864e5),w:x.w})).filter(p=>p.d<=weeks*7);
  const actPath=pts.map((p,i)=>`${i?'L':'M'}${X(p.d).toFixed(1)},${Y(p.w).toFixed(1)}`).join('');
  const ticks=[0,4,8,12,16].map(k=>`<text x="${X(k*7)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--faint)">${k?`wk ${k}`:'start'}</text>`).join('');
  const yt=[hi-3,Math.round((hi+lo)/2),lo+3].map(w=>`<text x="${pl-6}" y="${Y(w)+3}" text-anchor="end" font-size="10" fill="var(--faint)">${Math.round(w)}</text><line x1="${pl}" x2="${W-pr}" y1="${Y(w)}" y2="${Y(w)}" stroke="var(--line)"/>`).join('');
  const goalY=Y(S.profile.goal);
  const chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Predicted weight over 16 weeks">
    ${yt}
    ${S.profile.goal>lo&&S.profile.goal<hi?`<line x1="${pl}" x2="${W-pr}" y1="${goalY}" y2="${goalY}" stroke="var(--accent)" stroke-dasharray="2 4"/><text x="${W-pr}" y="${goalY-5}" text-anchor="end" font-size="10" font-weight="600" fill="var(--accent)">goal ${S.profile.goal}</text>`:''}
    <path d="${predPath}" fill="none" stroke="var(--faint)" stroke-width="2" stroke-dasharray="5 5"/>
    ${pts.length>1?`<path d="${actPath}" fill="none" stroke="var(--pro)" stroke-width="2.5" stroke-linejoin="round"/>`:''}
    ${pts.map(p=>`<circle cx="${X(p.d)}" cy="${Y(p.w)}" r="4" fill="var(--pro)" stroke="var(--card)" stroke-width="2"/>`).join('')}
    ${ticks}</svg>`;
  const ahead=[4,8,12].map(k=>{const f=forecast(cur,k*7);return `<li><div class="grow">In ${k} weeks</div><b>${Math.round(f[f.length-1])} lb</b></li>`;}).join('');
  const weekly=(burn(cur)-S.macros.cal)*7/3500;
  return `<div class="eyebrow">Progress</div><h1>${lost>0?`${r1(lost)} lb down`:'Day one starts now'}</h1>
  <p class="muted small" style="margin:0">Started at ${start.w} lb on ${fmtDate(t0)} · now ${cur} lb</p>
  <div class="card">
    <h3>Weigh in</h3>
    <p class="small muted" style="margin:4px 0 12px">Once a week, same morning, after the bathroom, before coffee.</p>
    <div class="row"><input id="wIn" type="number" inputmode="decimal" step="0.1" placeholder="${cur}" style="flex:1;min-width:0;width:0;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:17px"><button class="btn primary" data-a="saveW">Save</button></div>
  </div>
  <div class="card">
    <div class="row between"><h3>Your forecast</h3><span class="small muted"><span style="display:inline-block;width:14px;border-top:2px dashed var(--faint);vertical-align:3px"></span> plan &nbsp;<i class="dot" style="background:var(--pro)"></i>you</span></div>
    <div style="margin-top:10px">${chart}</div>
    <ul class="list" style="margin-top:6px">${ahead}
      <li><div class="grow">Reach ${S.profile.goal} lb</div><b>${gd?`${fmtDate(gd)}${gd.getFullYear()!==today().getFullYear()?', '+gd.getFullYear():''}`:gd===null?'Done!':'—'}</b></li></ul>
    <p class="small muted" style="margin:10px 0 0">At ${fmtN(S.macros.cal)} cal a day you’re losing about <b style="color:var(--ink)">${r1(Math.max(0,weekly))} lb a week</b>. It slows a little as you get lighter — the forecast already accounts for that. Expect a faster first week (water) and some zig-zags; follow the trend, not one day.</p>
  </div>
  <div class="card"><h3>Why ${S.profile.goal} lb?</h3><p class="small muted" style="margin:6px 0 0">Losing about 10% of your body weight is the amount research links to the biggest drop in liver fat. When you get there, set your next goal in <b>Me</b>.</p></div>
  ${ws.length?`<div class="card"><h3>Weigh-ins</h3><ul class="list">${[...ws].reverse().slice(0,12).map(x=>`<li><div class="grow">${fmtDate(pKey(x.d))}</div><b>${x.w} lb</b><button class="btn ghost" style="height:30px;padding:0 4px" data-a="delW" data-v="${x.d}" aria-label="delete">✕</button></li>`).join('')}</ul></div>`:''}`;
}

function viewMe(){
  const m=S.macros, c=carbsOf(m), w=curWeight(), b=burn(w), weekly=(b-m.cal)*7/3500;
  const cp=c*4/m.cal, pp=m.p*4/m.cal;
  const notes=[];
  notes.push(`You burn about <b>${fmtN(Math.round(b/10)*10)}</b> calories a day.`);
  notes.push(`Eating <b>${fmtN(m.cal)}</b> means about <b>${r1(weekly)} lb</b> lost per week.${weekly>2.5?' That’s fast — consider eating a bit more.':weekly<.5?' That’s slow — consider eating a bit less.':' A healthy, steady pace.'}`);
  notes.push(`Your carbs work out to <b>${c} g</b> (what’s left after protein and fat).`);
  const pick=dietitianPick(m.cal), isPick=m.p===pick.p&&m.f===pick.f;
  // how close the real week of meals gets to these numbers
  const ws=weekStart(0), avg={p:0,c:0}; for(let i=0;i<7;i++){const t=buildDay(dKey(addDays(ws,i))).totals;avg.p+=t.p/7;avg.c+=t.c/7;}
  const off=Math.abs(avg.p-m.p)>8||avg.c<c-12;
  const tip = (cp>.42||off)&&!isPick ? `<div class="card" style="background:var(--warn-soft);box-shadow:none"><h3 style="color:var(--warn)">A dietitian’s note</h3><p class="small" style="margin:6px 0 10px">${cp>.42?`At ${c} g, carbs are almost half your day — high for a fatty-liver plan, and it leaves less room for meat. `:''}${off?`With your food list, meals land around <b>${Math.round(avg.p)} g protein</b> and <b>${Math.round(avg.c)} g carbs</b> a day — reaching ${c} g carbs would mean shrinking the meat to tiny portions. `:''}This keeps your calories the same with more protein and fewer carbs, and the plan hits it almost exactly:<br><b>${pick.p} g protein · ${pick.f} g fat · ${carbsOf(pick)} g carbs</b></p><button class="btn primary" data-a="usePick">Use this</button></div>` : '';
  const inp=(path,val,attrs='')=>`<input type="number" inputmode="decimal" data-set="${path}" value="${val}" ${attrs}>`;
  const sw=(path,on)=>`<button class="switch ${on?'on':''}" data-a="toggle" data-v="${path}" role="switch" aria-checked="${on}"></button>`;
  const ft=Math.floor(S.profile.hIn/12), inch=S.profile.hIn%12;
  return `<div class="eyebrow">Settings</div><h1>Me</h1>
  <div class="card"><h3>Your numbers, checked</h3><ul class="list" style="margin-top:6px">${notes.map(n=>`<li><div class="grow small">${n}</div></li>`).join('')}</ul></div>
  ${tip}
  <details class="card" open><summary>My daily numbers</summary><div class="in">
    <div class="field"><label>Calories</label>${inp('macros.cal',m.cal)}</div>
    <div class="field"><label>Protein <small>grams</small></label>${inp('macros.p',m.p)}</div>
    <div class="field"><label>Fat <small>grams</small></label>${inp('macros.f',m.f)}</div>
    <div class="carbs"><span>Carbs <span class="small muted">— figured out for you</span></span><b style="font-size:20px">${c} g</b></div>
    <div class="row" style="margin-top:12px;gap:8px">
      <button class="btn" style="flex:1" data-a="useMine">My original</button>
      <button class="btn" style="flex:1" data-a="usePick">Dietitian pick</button></div>
    <p class="tiny muted" style="margin:10px 0 0">Every meal re-sizes itself automatically when you change these.</p>
  </div></details>
  <details class="card"><summary>My day</summary><div class="in">
    <div class="field"><label>I wake up at</label><input type="time" data-set="wake" value="${toTime(S.wake)}"></div>
    <div class="field"><label>Dinner starts at <small>Kitchen closes 30 min later</small></label><input type="time" data-set="dinner" value="${toTime(S.dinner)}"></div>
    <div class="field"><label>Morning snack <small>Small and low-carb, to hold you until lunch</small></label>${sw('early',S.early)}</div>
  </div></details>
  <details class="card"><summary>Me & my goal</summary><div class="in">
    <div class="field"><label>First name</label><input type="text" data-set="name" value="${esc(S.name)}" placeholder="Optional"></div>
    <div class="field"><label>Height</label><div class="row" style="gap:6px"><input type="number" style="width:64px" data-set="ft" value="${ft}"><span class="muted">ft</span><input type="number" style="width:64px" data-set="in" value="${inch}"><span class="muted">in</span></div></div>
    <div class="field"><label>Age</label>${inp('profile.age',S.profile.age)}</div>
    <div class="field"><label>Starting weight <small>lb</small></label>${inp('profile.start',S.profile.start)}</div>
    <div class="field"><label>Goal weight <small>lb</small></label>${inp('profile.goal',S.profile.goal)}</div>
    <div class="field"><label>Activity</label><select data-set="profile.act">${[[1.2,'Mostly sitting'],[1.375,'Light'],[1.55,'Moderate — walks + 3× strength'],[1.725,'Very active']].map(([v,l])=>`<option value="${v}" ${S.profile.act==v?'selected':''}>${l}</option>`).join('')}</select></div>
  </div></details>
  <details class="card"><summary>My daily staples</summary><div class="in">
    <p class="small muted" style="margin:0 0 4px">Check these against your labels once — everything else updates.</p>
    <div class="field"><label>Half & half in coffee <small>Tbsp</small></label>${inp('st.cTbsp',S.st.cTbsp,'step="0.5"')}</div>
    <div class="field"><label>Half & half calories <small>per Tbsp</small></label>${inp('st.cr.cal',S.st.cr.cal)}</div>
    <div class="field"><label>Half & half fat <small>g per Tbsp</small></label>${inp('st.cr.f',S.st.cr.f,'step="0.1"')}</div>
    <div class="field"><label>Prime Protein <small>scoops per shake</small></label>${inp('st.scoops',S.st.scoops,'step="0.5"')}</div>
    <div class="field"><label>Per scoop: calories</label>${inp('st.sc.cal',S.st.sc.cal)}</div>
    <div class="field"><label>Per scoop: protein <small>g</small></label>${inp('st.sc.p',S.st.sc.p)}</div>
    <div class="field"><label>Per scoop: carbs <small>g</small></label>${inp('st.sc.c',S.st.sc.c)}</div>
    <div class="field"><label>Per scoop: fat <small>g</small></label>${inp('st.sc.f',S.st.sc.f,'step="0.5"')}</div>
    <div class="field"><label>Milk in shake <small>oz</small></label>${inp('st.milkOz',S.st.milkOz)}</div>
    <div class="field"><label>Coconut water in adrenal cocktail <small>oz</small></label>${inp('st.cwOz',S.st.cwOz)}</div>
  </div></details>
  <details class="card"><summary>My food rules</summary><div class="in rules">
    <p><b>Yes:</b> meat (lots!), fish, eggs, chicken or beef bone broth, cooked veggies, sweet potato, lentils, black beans, citrus & tropical fruit, avocado, coconut, A2 / goat / sheep dairy, raw aged cheese, kefir, plain Greek yogurt.</p>
    <p><b>Cook with:</b> butter, olive oil, tallow or coconut oil — nothing else.</p>
    <p><b>Drink:</b> water, coffee, herbal tea, green tea, juice with no sugar added.</p>
    <p><b>No:</b> grains of any kind, nuts or seeds, raw veggies, spinach or kale, fried or packaged foods, alcohol, fizzy drinks, cottage cheese, sour cream.</p>
    <p><b>Timing:</b> breakfast within 1 hour of waking, eat every 3–4 hours, nothing after dinner.</p>
  </div></details>
  <details class="card"><summary>How this app works</summary><div class="in small">
    <p style="margin:0 0 8px">Each meal is a simple recipe. Every day the planner sizes each portion so the whole day hits your protein, carbs and fat — while keeping breakfast low-carb with 30 g+ protein, putting carbs at lunch and in the afternoon, and closing the kitchen after dinner.</p>
    <p style="margin:0 0 8px">Swap any meal and the rest of the day re-balances. Change your numbers and every portion updates.</p>
    <p class="muted" style="margin:0">Nutrition values come from USDA data. This is a planning tool — check big changes with your doctor.</p>
  </div></details>
  <button class="btn ghost block" data-a="reset" style="margin-top:8px">Start over</button>`;
}

/* ============================================================
   SWAP SHEET + ONBOARDING
   ============================================================ */
function openSwap(key,slot){
  const cur=recipeFor(slot,key,pKey(key).getDay());
  const name=k=>slot==='s2'?`Protein Shake + ${FRUITS[k][1]}`:R[k].n;
  $('#sheet').innerHTML=`<div class="grab"></div><h2>Swap ${SLOTNAME[slot].toLowerCase()}</h2><p class="small muted" style="margin:0 0 6px">Portions re-size automatically to keep your day on target.</p>
    <ul class="list">${POOL[slot].map(k=>`<li><button class="grow" style="text-align:left;padding:4px 0" data-a="pick" data-k="${key}" data-s="${slot}" data-v="${k}">${esc(name(k))}${k===WEEK[slot][pKey(key).getDay()]?' <span class="tiny muted">· usual</span>':''}</button>${k===cur?'<span class="chip">Current</span>':''}</li>`).join('')}</ul>`;
  $('#sheet').classList.add('show');$('#scrim').classList.add('show');
}
function closeSheet(){$('#sheet').classList.remove('show');$('#scrim').classList.remove('show');}

function renderOb(){
  if(S.setup){$('#ob').innerHTML='';return;}
  const st=UI.ob, steps=`<div class="steps">${[0,1,2].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>`;
  const mine=MINE, pick=dietitianPick(MINE.cal);
  const opt=(k,title,badge,m,desc)=>`<button class="opt ${UI.obPick===k?'on':''}" data-a="obPick" data-v="${k}">
    <div class="row between"><h3>${title}</h3>${badge?`<span class="chip">${badge}</span>`:''}</div>
    <div class="nums"><span><b>${fmtN(m.cal)}</b> cal</span><span>Protein <b>${m.p}g</b></span><span>Fat <b>${m.f}g</b></span><span>Carbs <b>${carbsOf(m)}g</b></span></div>
    <p class="small muted" style="margin:8px 0 0">${desc}</p></button>`;
  let body;
  if(st===0) body=`<div class="logo">${ICON.leaf.replace('width="16" height="16"','width="30" height="30"').replace('currentColor','#fff')}</div>
    <h1>Hi! Let’s make eating easy.</h1>
    <p class="muted">Every meal planned, every portion measured, all the math done. Just open the app and eat what it says.</p>
    <div class="card"><div class="field"><label>Your first name</label><input type="text" id="obName" value="${esc(S.name)}" placeholder="Optional"></div></div>`;
  else if(st===1) body=`<h1>Your day</h1><p class="muted">Meals are timed around these. You can change them anytime.</p>
    <div class="card"><div class="field"><label>I wake up at</label><input type="time" id="obWake" value="${toTime(S.wake)}"></div>
    <div class="field"><label>Dinner starts at</label><input type="time" id="obDin" value="${toTime(S.dinner)}"></div>
    <div class="field"><label>Today’s weight <small>lb</small></label><input type="number" inputmode="decimal" id="obW" value="${S.profile.start}"></div></div>`;
  else body=`<h1>Your daily numbers</h1><p class="muted">Pick one. You can switch later in <b>Me</b>.</p>
    ${opt('mine','Your numbers','',mine,'Exactly what you entered. Carbs are what’s left after protein and fat.')}
    ${opt('pick','Dietitian pick','More meat',pick,'Same calories. More protein and fewer carbs — friendlier for a fatty liver and keeps you fuller.')}`;
  $('#ob').innerHTML=`<div class="ob"><div class="wrap">${steps}<div class="grow">${body}</div>
    <div class="row" style="gap:10px;margin-top:20px">${st?`<button class="btn" data-a="obBack">Back</button>`:''}<button class="btn primary" style="flex:1" data-a="obNext">${st===2?'Start my plan':'Next'}</button></div></div></div>`;
}
function obCapture(){
  const n=$('#obName'); if(n) S.name=n.value.trim();
  const w=$('#obWake'); if(w&&w.value) S.wake=fromTime(w.value);
  const d=$('#obDin'); if(d&&d.value) S.dinner=fromTime(d.value);
  const wt=$('#obW'); if(wt&&+wt.value) S.profile.start=+wt.value;
}

/* ============================================================
   RENDER + EVENTS
   ============================================================ */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}
function render(){
  renderTabs(); renderOb();
  const v={today:viewToday,week:viewWeek,progress:viewProgress,me:viewMe}[UI.tab];
  // keep open <details> panels open across re-renders
  const openD=[...document.querySelectorAll('#view details')].map(d=>d.open);
  $('#view').innerHTML=v();
  document.querySelectorAll('#view details').forEach((d,i)=>{if(openD[i]!==undefined)d.open=openD[i];});
}
function setPath(path,val){
  if(path==='ft'||path==='in'){const ft=Math.floor(S.profile.hIn/12),i=S.profile.hIn%12;S.profile.hIn=path==='ft'?(+val)*12+i:ft*12+(+val);return;}
  if(path==='wake'||path==='dinner'){S[path]=fromTime(val);return;}
  if(path==='name'){S.name=val.trim();return;}
  const ks=path.split('.');let o=S;for(const k of ks.slice(0,-1))o=o[k];
  const num=+val; if(!isFinite(num)||val==='') return; o[ks[ks.length-1]]=num;
}
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-set]'); if(!el) return;
  setPath(el.dataset.set,el.value); save(); render(); toast('Saved — plan updated');
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a, v=el.dataset.v;
  if(a==='check') e.stopPropagation();
  switch(a){
    case 'tab': UI.tab=v; UI.open=null; window.scrollTo(0,0); break;
    case 'open': UI.open=UI.open===v?null:v; break;
    case 'check': {const lg=logOf(el.dataset.k);lg.done[el.dataset.id]=!lg.done[el.dataset.id];
      if(lg.done[el.dataset.id]){toast('Nice — logged'); if(navigator.vibrate) navigator.vibrate(10);} save(); break;}
    case 'water': {const lg=logOf(dKey(today()));lg.water=lg.water===+v?+v-1:+v;save();break;}
    case 'swap': openSwap(el.dataset.k,el.dataset.s); return;
    case 'pick': {const k=el.dataset.k;S.swaps[k]=S.swaps[k]||{};
      if(v===WEEK[el.dataset.s][pKey(k).getDay()]) delete S.swaps[k][el.dataset.s]; else S.swaps[k][el.dataset.s]=v;
      save(); closeSheet(); toast('Swapped — portions re-balanced'); break;}
    case 'close': closeSheet(); return;
    case 'day': UI.weekDay=+v; UI.open=null; break;
    case 'seg': UI.seg=v; break;
    case 'shopWeek': UI.shopWeek=+v; break;
    case 'shop': {const w=el.dataset.w;S.shop[w]=S.shop[w]||{};S.shop[w][v]=!S.shop[w][v];save();break;}
    case 'toggle': S[v]=!S[v]; save(); toast('Saved — plan updated'); break;
    case 'useMine': S.macros={...MINE}; save(); toast('Using your original numbers'); break;
    case 'usePick': S.macros=dietitianPick(S.macros.cal); save(); toast('Dietitian pick applied'); break;
    case 'hideInstall': S.hideInstall=true; save(); break;
    case 'saveW': {const w=+$('#wIn').value; if(!(w>50&&w<800)){toast('Enter your weight in lb');return;}
      const k=dKey(today()); S.weights=S.weights.filter(x=>x.d!==k); S.weights.push({d:k,w}); save(); toast('Weigh-in saved'); break;}
    case 'delW': S.weights=S.weights.filter(x=>x.d!==v); save(); break;
    case 'reset': if(!confirm('Erase everything and start over?')) return; localStorage.removeItem(KEY); location.reload(); return;
    case 'obNext': obCapture();
      if(UI.ob<2){UI.ob++;}
      else{S.macros=UI.obPick==='pick'?dietitianPick(MINE.cal):{...MINE}; S.setup=true;
        if(!S.weights.length) S.weights.push({d:dKey(today()),w:S.profile.start});
        S.profile.goal=Math.round(S.profile.start*.9); save();}
      break;
    case 'obBack': obCapture(); UI.ob--; break;
    case 'obPick': UI.obPick=v; break;
  }
  render();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden) render();});
setInterval(()=>{if(UI.tab==='today'&&!document.querySelector('#view input:focus')) render();},60000);
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
